<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400..800;1,6..72,400..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <title>DuraGrit Vitrified - Mobile Retail & QR Portal</title>
    <script>
      // Force clean any legacy stale PWA caches on version bump
      (function() {
        var APP_VER = 'v4.9.9';
        try {
          var last = localStorage.getItem('duragrit_client_pwa_version');
          if (last !== APP_VER) {
            localStorage.setItem('duragrit_client_pwa_version', APP_VER);
            // Purge obsolete releases and broadcast events
            localStorage.removeItem('duragrit_admin_app_releases_v1');
            localStorage.removeItem('duragrit_app_releases_v1');
            localStorage.removeItem('duragrit_ota_last_broadcast');
            localStorage.removeItem('duragrit_admin_ota_last_broadcast');
            localStorage.setItem('duragrit_client_installed_version', 'v4.9.9');
            localStorage.setItem('duragrit_client_installed_build', '169');
            localStorage.setItem('duragrit_admin_installed_version', 'v4.9.9');
            localStorage.setItem('duragrit_admin_installed_build', '169');
            ['v4.8.2', 'v4.8.3', 'v4.8.4', 'v4.8.5', 'v4.8.7', 'v4.8.8', 'v4.8.9', 'v4.9.0', 'v4.9.1', 'v4.9.2', 'v4.9.3', 'v4.9.4', 'v4.9.5', 'v4.9.7', 'v4.9.8', 'v4.9.9'].forEach(function(ver) {
              localStorage.setItem('duragrit_ota_applied_' + ver, 'true');
              localStorage.setItem('duragrit_ota_dismissed_' + ver, 'true');
              localStorage.setItem('duragrit_ota_applied_' + ver.replace('v',''), 'true');
              localStorage.setItem('duragrit_ota_dismissed_' + ver.replace('v',''), 'true');
              localStorage.setItem('duragrit_admin_ota_applied_' + ver, 'true');
              localStorage.setItem('duragrit_admin_ota_dismissed_' + ver, 'true');
              localStorage.setItem('duragrit_admin_ota_applied_' + ver.replace('v',''), 'true');
              localStorage.setItem('duragrit_admin_ota_dismissed_' + ver.replace('v',''), 'true');
            });
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                keys.forEach(function(k) {
                  caches.delete(k);
                });
              });
            }
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="bg-[#FAF9F6] text-stone-900 font-serif antialiased selection:bg-[#C84826] selection:text-white overscroll-none">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
